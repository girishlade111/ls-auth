name: Delete Old Package

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  delete-package:
    runs-on: ubuntu-latest
    steps:
      - name: Delete com.aistudio.lsauth.ls-auth package
        run: |
          echo "Attempting to delete com.aistudio.lsauth.ls-auth package..."
          curl -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/maven/com.aistudio.lsauth.ls-auth" || true
          
          curl -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/${{ github.actor }}/packages/maven/com.aistudio.lsauth.ls-auth" || true
